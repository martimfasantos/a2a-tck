[project]
name = "tck-core-agent"
version = "1.0.0"
description = "TCK Core Agent - A complete A2A agent implementation for testing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=0.3.10",
    "uvicorn>=0.34.2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build" 
